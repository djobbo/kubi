include:
  - path: ./apps/instrumentation/compose.yml

services:
  postgres:
    image: postgres:18-alpine
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dair}
      POSTGRES_DB: ${POSTGRES_DB:-dair}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dair} -d ${POSTGRES_DB:-dair}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./.data/postgres:/var/lib/postgresql/18/docker

  redis:
    image: redis:8-alpine
    ports:
      - 6379:6379
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./.data/redis:/data
